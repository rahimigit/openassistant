name: Build and Publish

on:
  # automatic triggers removed 2026-10-30 to stop burning hosted-runner minutes; run manually
  workflow_dispatch:

jobs:
  build: # Renamed from 'publish' to 'build' since it's not always publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Lerna to access tags

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.0.0 --activate

      - name: Install dependencies
        run: |
          yarn --version
          yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Build packages
        run: yarn build-slow

      # - name: Test
      #   run: yarn test

      - name: Publish packages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          yarn publish-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}